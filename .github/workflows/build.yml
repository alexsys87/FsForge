name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: WPF .NET ${{ matrix.dotnet }} / Windows x64 / MSI
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        dotnet: ['8', '10']
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      # global.json selects SDK 10; SDK 8 also supplies the runtime for net8 tests.
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build WPF
        run: dotnet build src/FsForge.App -c Release -f net${{ matrix.dotnet }}.0-windows

      - name: Core self-test
        run: dotnet run --project tools/FsForge.Cli -c Release -f net${{ matrix.dotnet }}.0 -- selftest

      - name: Application scenario tests
        run: dotnet run --project tests/FsForge.Presentation.Tests -c Release -f net${{ matrix.dotnet }}.0

      - name: Check XAML bindings
        run: |
          dotnet run --project tests/FsForge.Presentation.Tests -c Release -f net${{ matrix.dotnet }}.0 --no-build -- --dump-properties > props.txt
          python tests/check-bindings.py props.txt

      - name: Check translations
        run: python tests/check-translations.py

      - name: Publish framework-dependent WPF
        run: dotnet publish src/FsForge.App -c Release -f net${{ matrix.dotnet }}.0-windows -r win-x64 --self-contained false -o publish/framework-dependent

      - uses: actions/upload-artifact@v6
        with:
          name: FsForge-net${{ matrix.dotnet }}-win-x64
          path: publish/framework-dependent
          if-no-files-found: error

      - name: Publish standalone single exe
        run: dotnet publish src/FsForge.App -f net${{ matrix.dotnet }}.0-windows -p:PublishProfile=win-x64-standalone -o publish/standalone

      - uses: actions/upload-artifact@v6
        with:
          name: FsForge-net${{ matrix.dotnet }}-win-x64-standalone
          path: publish/standalone/FsForge.exe
          if-no-files-found: error

      - name: Install WiX and standard installer UI
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2

      - name: Build MSI from standalone application
        run: |
          ./installer/Build-Msi.ps1 -PublishDirectory publish/standalone -DotNetMajor ${{ matrix.dotnet }} -ProductVersion "0.1.${{ github.run_number }}" -WixPath wix -OutputPath "artifacts/FsForge-net${{ matrix.dotnet }}-win-x64.msi"

      - name: Test MSI installation and removal
        run: |
          ./installer/Test-Msi.ps1 -MsiPath "artifacts/FsForge-net${{ matrix.dotnet }}-win-x64.msi" -PublishDirectory publish/standalone -InstallDirectory "$env:RUNNER_TEMP/FsForge-MSI-net${{ matrix.dotnet }}" -LogDirectory artifacts/msi-logs

      - name: Upload MSI logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: FsForge-net${{ matrix.dotnet }}-msi-logs
          path: artifacts/msi-logs
          if-no-files-found: ignore

      - name: Upload MSI installer
        uses: actions/upload-artifact@v6
        with:
          name: FsForge-net${{ matrix.dotnet }}-win-x64-msi
          path: artifacts/*.msi
          if-no-files-found: error
