name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: WPF .NET 10 / Windows x64 / MSI
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build solution
        run: dotnet build FsForge.sln -c Release

      - name: Core self-test
        run: dotnet run --project tools/FsForge.Cli -c Release --no-build -- selftest

      - name: Application scenario tests
        run: dotnet run --project tests/FsForge.Presentation.Tests -c Release --no-build

      - name: Check XAML bindings
        run: |
          dotnet run --project tests/FsForge.Presentation.Tests -c Release --no-build -- --dump-properties > props.txt
          python tests/check-bindings.py props.txt

      - name: Check translations
        run: python tests/check-translations.py

      - name: Publish framework-dependent WPF
        run: dotnet publish src/FsForge.App -c Release -r win-x64 --self-contained false -o publish/framework-dependent

      - uses: actions/upload-artifact@v6
        with:
          name: FsForge-win-x64
          path: publish/framework-dependent
          if-no-files-found: error

      - name: Publish standalone single exe
        run: dotnet publish src/FsForge.App -p:PublishProfile=win-x64-standalone -o publish/standalone

      - uses: actions/upload-artifact@v6
        with:
          name: FsForge-win-x64-standalone
          path: publish/standalone/FsForge.exe
          if-no-files-found: error

      - name: Install WiX and standard installer UI
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add --global WixToolset.UI.wixext/5.0.2

      - name: Build MSI from standalone application
        run: |
          ./installer/Build-Msi.ps1 -PublishDirectory publish/standalone -ProductVersion "0.1.${{ github.run_number }}" -WixPath wix -OutputPath "artifacts/FsForge-win-x64.msi"

      - name: Test MSI installation and removal
        run: |
          ./installer/Test-Msi.ps1 -MsiPath "artifacts/FsForge-win-x64.msi" -PublishDirectory publish/standalone -InstallDirectory "$env:RUNNER_TEMP/FsForge-MSI" -LogDirectory artifacts/msi-logs

      - name: Upload MSI logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: FsForge-msi-logs
          path: artifacts/msi-logs
          if-no-files-found: ignore

      - name: Upload MSI installer
        uses: actions/upload-artifact@v6
        with:
          name: FsForge-win-x64-msi
          path: artifacts/*.msi
          if-no-files-found: error
